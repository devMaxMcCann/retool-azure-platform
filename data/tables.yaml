- table: chicago_business_licenses
  class: public-raw
  target_db: ingest
  source_module: sources/chicago_business_licenses.py + ingest_business_licenses.py
  publisher: City of Chicago (data.cityofchicago.org)
  license: City of Chicago Data Terms of Use (redistribution permitted; mandatory disclaimer on derivative apps; City may
    require takedown)
  license_url: https://www.chicago.gov/city/en/narr/foia/data_disclaimer.html
  license_status: verified
  drop_columns:
  - property_owner_reference
  - verified_address
  - verified_pin
  - address_verified_at
  row_filter: license_description NOT IN ('Home Occupation','Peddler License','Home Repair') AND legal_name ~* '\m(inc|incorporated|llc|l\.l\.c|corp|corporation|company|co|ltd|limited|lp|llp|lllp|pllc|pc|p\.c|nfp|foundation|association|assn|bank|n\.a|university|college|hospital|church|district|authority|partners|partnership|holdings|group)\M'
  decision: publish-filtered
  reason: City terms allow derivative apps with a mandatory disclaimer. legal_name is a person's name for sole proprietors,
    and home-occupation/peddler licences give home addresses. verified_* comes from Cook County (no reuse grant) and owner
    names.
  compliance_registry_id: null
- table: idfpr_licenses
  class: public-raw
  target_db: ingest
  source_module: sources/idfpr_licenses.py + ingest_idfpr_licenses.py
  publisher: Illinois Dept. of Financial and Professional Regulation (via Illinois open data, illinois-edp.data.socrata.com)
  license: ODbL 1.0 (dataset metadata licenseId=ODBL; attribution + share-alike on derived databases)
  license_url: https://opendatacommons.org/licenses/odbl/1-0/
  license_status: verified
  drop_columns: []
  row_filter: business_name ~* '\m(inc|incorporated|llc|l\.l\.c|corp|corporation|company|co|ltd|limited|lp|llp|lllp|pllc|pc|p\.c|nfp|foundation|association|assn|bank|n\.a|university|college|hospital|church|district|authority|partners|partnership|holdings|group)\M'
  decision: publish-filtered
  reason: ODbL, so attribution is required and derived DBs are share-alike. business='Y' rows can still be a person's name,
    so keep entities only. Has no street address.
  compliance_registry_id: null
