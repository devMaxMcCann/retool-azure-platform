  - property_owner_reference
  - verified_address
  - verified_pin
  - address_verified_at
  - raw_record
  row_filter: company is an Illinois WARN filer (exact normalized-name match)
  decision: publish-filtered
  reason: Entity-level statutory notices. Owner accepted publishing (owner_decision). In the Azure build the table is ingested
    fresh from DCEO, so it holds only public rows; the drops still apply because those columns came from Cook County.
  owner_decision: 'Accepted 2026-10-08 by the owner: WARN notices are statutory public filings that DCEO has published since
    1999; licence still unverified, so the basis is the owner''s judgement, not a licence.'
  compliance_registry_id: null
