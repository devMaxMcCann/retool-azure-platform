  target_db: ingest
  source_module: ingest_dol_lca.py
  publisher: U.S. Department of Labor (ETA OFLC)
  license: Public domain - US federal work (DOL copyright page)
  license_url: https://www.dol.gov/general/aboutdol/copyright
  license_status: verified
  drop_columns: []
  row_filter: employer_name ~* '\m(inc|incorporated|llc|l\.l\.c|corp|corporation|company|co|ltd|limited|lp|llp|lllp|pllc|pc|p\.c|nfp|foundation|association|assn|bank|n\.a|university|college|hospital|church|district|authority|partners|partnership|holdings|group)\M'
